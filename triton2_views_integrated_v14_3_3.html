// Single source of truth for geometry, graduations and selected heading.
// Positive deviation = starboard (right, green); negative = port (left, red).
function drawAutopilotSemicircle({current,centerLabel,leftLabel,rightLabel,showCourseMarker=false,selectedDelta=null}){
 const cx=250,cy=278,rOuter=270,rBand=255,top=1.5*Math.PI;
 arc(cx,cy,rOuter,1.17*Math.PI,1.83*Math.PI,'#8fc64a',3);
 arc(cx,cy,rBand,1.17*Math.PI,1.83*Math.PI,'#050505',18);
 const delta=Number(selectedDelta);
 const signed=selectedDelta===null||!Number.isFinite(delta)?0:Math.max(-58,Math.min(58,delta));
 if(Math.abs(signed)>.05){
  const target=top+signed*DEG;
  arc(cx,cy,rBand,Math.min(top,target),Math.max(top,target),signed>0?'#36ad61':'#e23843',18);
 }
 for(let i=0;i<=6;i++){
  const a=Math.PI*(1.19+i*.62/6);
  dl(cx+Math.cos(a)*246,cy+Math.sin(a)*246,cx+Math.cos(a)*265,cy+Math.sin(a)*265,'#fff',2);
 }
 dr(217,5,67,32,'#050608');dt(String(Math.round(current)).padStart(3,'0'),250,30,23,'#fff','center');
 dt(centerLabel,250,82,20,'#111','center');
 dt(leftLabel,94,139,20,'#111','center');
 dt(rightLabel,406,139,20,'#111','center');
 if(showCourseMarker&&Math.abs(signed)>.05){
  // Radial marker inside the original, unchanged wheel: tip faces the rim.
  const a=top+signed*DEG,ux=Math.cos(a),uy=Math.sin(a),tx=-uy,ty=ux;
  const tipR=243,baseR=215,halfWidth=11;
  const tip=[cx+ux*tipR,cy+uy*tipR],base=[cx+ux*baseR,cy+uy*baseR];
  poly([tip,[base[0]+tx*halfWidth,base[1]+ty*halfWidth],
    [base[0]-tx*halfWidth,base[1]-ty*halfWidth]],signed>0?'#36ad61':'#e23843');
 }
}

    overlay.appendChild(el);

  }
  const title=badge('', 'left:50%;top:4px;transform:translateX(-50%);width:96%;max-height:39px;overflow:hidden;white-space:normal;text-align:center;font-size:11px;line-height:1.25;');

  }
  function labelOf(value) {
    if (typeof value === 'string') return value.trim();
    if (value && typeof value === 'object') {

    }
